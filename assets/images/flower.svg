<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="flowerGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD1DC" stop-opacity="1" />
      <stop offset="65%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(100, 100)" filter="url(#softGlow)">
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(0)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(45)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(90)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(135)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(180)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(225)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(270)" />
    <ellipse cx="0" cy="-55" rx="26" ry="38" fill="url(#flowerGrad)" transform="rotate(315)" />
    <circle cx="0" cy="0" r="28" fill="#FFF0F5" />
    <circle cx="0" cy="0" r="16" fill="#F472B6" opacity="0.85" />
  </g>
</svg>